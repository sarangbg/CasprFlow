name: Build Singularity Image

on:
  push:
    branches: [main]
    paths:
      - '**.def'
      - '.github/workflows/build-sif.yml'
  workflow_dispatch:  # allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build SIF image
        run: |
          apptainer build casprflow.sif casprflow.def

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login --username ${{ github.actor }} --password-stdin oras://ghcr.io

      - name: Push SIF to GHCR
        run: |
          apptainer push casprflow.sif \
            oras://ghcr.io/${{ github.repository_owner }}/casprflow:latest
